<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hotel Profile — Tripify</title>
<link rel="icon" type="image/png" href="../../../../public/assets/images/favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --secondary:#10B981;--secondary-lt:#ECFDF5;
  --danger:#EF4444;--accent:#F59E0B;
  --bg:#F1F5F9;--sidebar:#1E293B;
  --sidebar-hover:rgba(255,255,255,0.07);--sidebar-active:rgba(16,185,129,0.22);
  --card:#FFFFFF;--border:#E2E8F0;
  --text-1:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --sidebar-w:260px;--topbar-h:64px;
  --r-sm:8px;--r:12px;--r-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow:0 4px 16px rgba(0,0,0,0.08);
  --shadow-green:0 4px 20px rgba(16,185,129,0.24);
  --font:'Inter',system-ui,sans-serif;
  --display:'Playfair Display',Georgia,serif;
  --ease:all 0.22s ease;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text-1);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{font-family:var(--font);cursor:pointer}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar);display:flex;flex-direction:column;z-index:200;overflow:hidden}
.sidebar-logo{display:flex;align-items:center;gap:11px;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0}
.logo-icon{width:38px;height:38px;background:var(--secondary);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-green)}
.logo-text{font-family:var(--display);font-size:21px;font-weight:700;color:#fff}
.logo-badge{font-size:9px;font-weight:700;letter-spacing:1px;background:rgba(16,185,129,0.25);color:#6EE7B7;padding:2px 7px;border-radius:20px;text-transform:uppercase;margin-left:auto}
.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-label{display:block;font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,0.28);padding:12px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:rgba(255,255,255,0.6);font-size:13.5px;font-weight:500;transition:var(--ease);margin-bottom:2px;border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#6EE7B7;border-color:rgba(16,185,129,0.25)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--secondary);border-radius:0 3px 3px 0}
.nav-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-divider{height:1px;background:rgba(255,255,255,0.07);margin:8px 10px}
.sidebar-footer{padding:12px 10px 14px;border-top:1px solid rgba(255,255,255,0.07);flex-shrink:0}
.user-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,0.05)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#10b981,#0891b2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid rgba(16,185,129,0.4)}
.user-name{font-size:12.5px;font-weight:600;color:#fff}
.user-role{font-size:10.5px;color:rgba(255,255,255,0.38);margin-top:1px}
.user-logout{margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.3);font-size:13px;padding:4px;transition:var(--ease);border-radius:4px}
.user-logout:hover{color:var(--danger);background:rgba(239,68,68,0.1)}

.topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 28px;z-index:100;box-shadow:var(--shadow-sm)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);flex:1}
.breadcrumb-cur{font-weight:600;color:var(--text-1)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#0891b2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;border:2px solid #d1fae5}

.main-wrap{margin-left:var(--sidebar-w);padding-top:var(--topbar-h);min-height:100vh}
.page-content{padding:28px 30px}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-family:var(--display);font-size:24px;font-weight:700;color:var(--text-1)}
.page-sub{font-size:13px;color:var(--text-3);margin-top:3px}

/* HOTEL SELECTOR */
.hotel-selector{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.hotel-tab{padding:9px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--text-2);cursor:pointer;transition:var(--ease)}
.hotel-tab:hover{border-color:var(--secondary);color:var(--secondary)}
.hotel-tab.active{background:var(--secondary);color:#fff;border-color:var(--secondary);box-shadow:var(--shadow-green)}

/* PROFILE LAYOUT */
.profile-layout{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.profile-layout{grid-template-columns:1fr}}

/* LEFT CARD */
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.hotel-cover{width:100%;height:200px;object-fit:cover;background:#E2E8F0;display:block}
.hotel-cover-placeholder{width:100%;height:200px;background:linear-gradient(135deg,#065F46,#10B981);display:flex;align-items:center;justify-content:center;font-size:56px}
.profile-body{padding:20px}
.hotel-name-big{font-family:var(--display);font-size:20px;font-weight:700;color:var(--text-1);margin-bottom:4px}
.hotel-dest-tag{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:4px;margin-bottom:14px}
.stars-big{color:var(--accent);font-size:18px;letter-spacing:2px}
.rating-summary{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rating-num{font-size:15px;font-weight:700;color:var(--text-1)}
.rating-sub{font-size:12px;color:var(--text-3)}

.info-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-icon{width:18px;height:18px;color:var(--text-3);flex-shrink:0;margin-top:2px}
.info-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.info-val{font-size:13.5px;color:var(--text-1);margin-top:2px;font-weight:500}

.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.q-stat{background:var(--bg);border-radius:var(--r-sm);padding:12px;text-align:center}
.q-stat-val{font-size:20px;font-weight:800;font-family:var(--display);color:var(--text-1)}
.q-stat-lbl{font-size:11px;color:var(--text-3);margin-top:2px}

/* RIGHT SECTION */
.right-section{display:flex;flex-direction:column;gap:20px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:22px 24px}
.info-card-title{font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.amenity-tags{display:flex;flex-wrap:wrap;gap:8px}
.amenity-tag{padding:5px 12px;background:var(--secondary-lt);color:var(--secondary);border-radius:20px;font-size:12px;font-weight:600}

/* ROOM TYPES TABLE */
.rooms-mini{width:100%;border-collapse:collapse}
.rooms-mini th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.rooms-mini td{padding:11px 14px;font-size:13px;color:var(--text-1);border-bottom:1px solid #F8FAFC}
.rooms-mini tr:last-child td{border-bottom:none}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#ECFDF5;color:var(--secondary)}
.badge-warning{background:#FFFBEB;color:#D97706}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;font-family:var(--font);border:none;cursor:pointer;transition:var(--ease)}
.btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--text-1)}
.btn-ghost:hover{background:#E2E8F0}
.btn-sm{padding:5px 12px;font-size:12px}

.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--secondary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

    <span class="logo-text">Tripify</span><span class="logo-badge">Hotel</span>
  </div>
  <nav class="sidebar-nav">

</aside>

<header class="topbar">
  <div class="breadcrumb">
    <span>Tripify</span><span style="font-size:11px">›</span>
    <span class="breadcrumb-cur">Hotel Profile</span>
  </div>
  <div class="topbar-actions">
    <div class="topbar-avatar" id="topbarInitials"></div>
  </div>
</header>

<div class="main-wrap">
<div class="page-content">

  <div class="page-hdr">
    <div>
      <div class="page-title">Hotel Profile</div>
      <div class="page-sub">Complete information about your hotel(s)</div>
    </div>
  </div>

  <div id="loadingState" style="text-align:center;padding:60px 0">
    <div class="spinner"></div>
    <div style="color:var(--text-3);font-size:13px;margin-top:12px">Loading profile…</div>
  </div>

  <div id="mainContent" style="display:none">
    <div style="margin-bottom:20px" id="hotelSelectorWrap">
      <select id="hotelSelect" onchange="loadProfile(parseInt(this.value))"
        style="padding:9px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13.5px;font-weight:600;font-family:var(--font);color:var(--text-1);background:var(--card);min-width:240px;outline:none;cursor:pointer">
      </select>
    </div>
    <div id="profileContent"></div>
  </div>

  <div id="emptyState" style="text-align:center;padding:80px 20px;display:none;color:var(--text-3)">
    <div style="font-size:48px;margin-bottom:14px">🏨</div>
    <p style="font-size:14px;color:var(--text-2)">No hotels assigned to your account.</p>
  </div>

</div>
</div>

<script src="../../../js/config/api.js"></script>
<script src="../../../js/services/authService.js"></script>
<script>
const token = sessionStorage.getItem('tripify_token');
if (!token) window.location.href = '../auth/login.html';
const user = JSON.parse(sessionStorage.getItem('tripify_user') || '{}');
if (user.userType !== 'HotelManager') window.location.href = '../auth/login.html';

function applyProfile(u) {
  const ini = (u.fullName || 'HM').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('sidebarName').textContent = u.fullName || 'Hotel Manager';
  if (u.profilePicture) {
    const img = `<img src="http://localhost:8080${u.profilePicture}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    document.getElementById('sidebarInitials').innerHTML = img;
    document.getElementById('topbarInitials').innerHTML  = img;
  } else {
    document.getElementById('sidebarInitials').textContent = ini;
    document.getElementById('topbarInitials').textContent  = ini;
  }
}
applyProfile(user);
(async () => {
  try {
    const r = await fetch(ENDPOINTS.USER.PROFILE, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return;
    const d = await r.json();
    if (d.profilePicture) {
      const updated = { ...user, profilePicture: d.profilePicture };
      sessionStorage.setItem('tripify_user', JSON.stringify(updated));
      applyProfile(updated);
    }
  } catch(e) {}
})();
function doLogout(){ AuthService.logout(); }

let hotels = [];

function hotelImg(imageUrl) {
  if (!imageUrl) return null;
  if (imageUrl.startsWith('http') || imageUrl.startsWith('/uploads')) return imageUrl;
  return '../../../../public/assets/images/' + imageUrl;
}

async function apiCall(url) {
  const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
  if (res.status === 401) { AuthService.logout(); return null; }
  return res;
}

function starsFull(n) {
  const s = Math.round(n || 0);
  return '★'.repeat(s) + '☆'.repeat(5 - s);
}

async function load() {
  try {
    const hRes = await apiCall(ENDPOINTS.HOTELS.MY);
    if (!hRes || !hRes.ok) throw new Error();
    hotels = await hRes.json();

    document.getElementById('loadingState').style.display = 'none';
    if (!hotels.length) { document.getElementById('emptyState').style.display = 'block'; return; }

    // Check URL param ?id=
    const urlId = new URLSearchParams(location.search).get('id');
    const startHotel = (urlId && hotels.find(h => String(h.id) === urlId)) || hotels[0];

    // Populate dropdown
    const sel = document.getElementById('hotelSelect');
    hotels.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h.id;
      opt.textContent = h.name;
      if (h.id === startHotel.id) opt.selected = true;
      sel.appendChild(opt);
    });
    // Hide selector if only one hotel
    if (hotels.length <= 1) document.getElementById('hotelSelectorWrap').style.display = 'none';

    document.getElementById('mainContent').style.display = 'block';
    await loadProfile(startHotel.id);
  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      '<div style="color:var(--danger);font-size:14px">Failed to load. Please refresh.</div>';
  }
}

async function loadProfile(hotelId) {
  const cont = document.getElementById('profileContent');
  cont.innerHTML = '<div style="text-align:center;padding:40px 0"><div class="spinner"></div></div>';

  try {
    const res = await apiCall(ENDPOINTS.HOTELS.BY_ID(hotelId));
    if (!res || !res.ok) throw new Error();
    const h = await res.json();

    const amenityList = h.amenities
      ? h.amenities.split(',').map(a => a.trim()).filter(Boolean)
      : [];

    cont.innerHTML = `
      <div class="profile-layout">

        <!-- LEFT -->
        <div class="profile-card">
          ${hotelImg(h.imageUrl)
            ? `<img class="hotel-cover" src="${hotelImg(h.imageUrl)}" alt="${h.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ''}
          <div class="hotel-cover-placeholder" ${hotelImg(h.imageUrl) ? 'style="display:none"' : ''}>🏨</div>
          <div class="profile-body">
            <div class="hotel-name-big">${h.name}</div>
            <div class="hotel-dest-tag">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${h.destinationName}
            </div>
            <div class="rating-summary">
              <div class="stars-big">${starsFull(h.stars)}</div>
              <div class="rating-num">${h.averageRating ? Number(h.averageRating).toFixed(1) : '—'}</div>
              <div class="rating-sub">(${h.totalReviews} reviews)</div>
            </div>

            <div class="info-row">
              <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <div><div class="info-label">Address</div><div class="info-val">${h.address || '—'}</div></div>
            </div>
            <div class="info-row">
              <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <div><div class="info-label">Contact</div><div class="info-val">${h.contactNumber || '—'}</div></div>
            </div>
            <div class="info-row">
              <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <div><div class="info-label">Base Rate</div><div class="info-val">PKR ${Number(h.pricePerNight).toLocaleString()} / night</div></div>
            </div>

            <div class="quick-stats">
              <div class="q-stat">
                <div class="q-stat-val">${h.availableRooms}</div>
                <div class="q-stat-lbl">Available Rooms</div>
              </div>
              <div class="q-stat">
                <div class="q-stat-val">${h.totalRooms}</div>
                <div class="q-stat-lbl">Total Rooms</div>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="right-section">

          ${h.description ? `
          <div class="info-card">
            <div class="info-card-title">📋 About this Hotel</div>
            <p style="font-size:13.5px;color:var(--text-2);line-height:1.7">${h.description}</p>
          </div>` : ''}

          ${amenityList.length ? `
          <div class="info-card">
            <div class="info-card-title">✨ Amenities</div>
            <div class="amenity-tags">
              ${amenityList.map(a => `<span class="amenity-tag">${a}</span>`).join('')}
            </div>
          </div>` : ''}

          <div class="info-card">
            <div class="info-card-title" style="justify-content:space-between">
              <span>🛏️ Room Types (${(h.roomTypes||[]).length})</span>
              <a href="hm-rooms.html" class="btn btn-ghost btn-sm" style="font-size:12px">Manage Rooms</a>
            </div>
            ${h.roomTypes && h.roomTypes.length ? `
            <div style="overflow-x:auto">
              <table class="rooms-mini">
                <thead><tr>
                  <th>Type</th>
                  <th>Capacity</th>
                  <th>Price / Night</th>
                  <th>Availability</th>
                </tr></thead>
                <tbody>
                  ${h.roomTypes.map(rt => `
                    <tr>
                      <td><strong>${rt.typeName}</strong></td>
                      <td>${rt.capacity} guest${rt.capacity !== 1 ? 's' : ''}</td>
                      <td>PKR ${Number(rt.pricePerNight).toLocaleString()}</td>
                      <td>
                        <span class="badge ${rt.availableRooms > 0 ? 'badge-success' : 'badge-warning'}">
                          ${rt.availableRooms} / ${rt.totalRooms}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ` : `<p style="font-size:13px;color:var(--text-3)">No room types yet. <a href="hm-rooms.html" style="color:var(--secondary);font-weight:600">Add room types →</a></p>`}
          </div>

          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <a href="hm-bookings.html?hotelId=${h.id}" class="btn btn-ghost" style="font-size:13px">📋 View Bookings</a>
            <a href="hm-reviews.html?hotelId=${h.id}" class="btn btn-ghost" style="font-size:13px">⭐ View Reviews</a>
            <a href="hm-pricing.html?hotelId=${h.id}" class="btn btn-ghost" style="font-size:13px">💰 Manage Pricing</a>
          </div>

        </div>
      </div>
    `;
  } catch(e) {
    cont.innerHTML = '<div style="color:var(--danger);text-align:center;padding:30px">Failed to load hotel details.</div>';
  }
}

load();
</script>
</body>
</html>
