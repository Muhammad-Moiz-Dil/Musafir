<style>
.dest-hero {
    position: relative; height: 340px; border-radius: 20px; overflow: hidden; margin-bottom: 26px;
}
.dest-hero img { width:100%; height:100%; object-fit:cover; object-position:center; }
.dest-hero-overlay {
    position:absolute; inset:0;
    background:linear-gradient(to top,rgba(7,14,23,0.92) 0%,rgba(7,14,23,0.3) 50%,transparent 100%);
}
.dest-hero-content {
    position:absolute; bottom:0; left:0; right:0; padding:28px 32px;
}
.dest-hero-name { font-family:var(--display); font-size:clamp(26px,4vw,40px); font-weight:800; color:var(--white); margin-bottom:6px; }
.dest-hero-region { font-size:14px; color:rgba(255,255,255,0.65); display:flex; align-items:center; gap:6px; }
.dest-hero-wish {
    position:absolute; top:20px; right:20px;
    width:42px; height:42px; border-radius:50%;
    background:rgba(0,0,0,0.45); backdrop-filter:blur(8px);
    border:none; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:var(--ease);
}
.dest-hero-wish:hover { transform:scale(1.12); background:rgba(239,68,68,0.6); }

.info-strip {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; margin-bottom:26px;
}
.info-chip {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r); padding:14px 16px; text-align:center;
    transition:var(--ease);
}
.info-chip:hover { border-color:rgba(245,166,35,0.25); }
.info-chip-icon { font-size:22px; margin-bottom:5px; }
.info-chip-val { font-size:14px; font-weight:700; color:var(--white); }
.info-chip-lbl { font-size:11px; color:var(--t3); margin-top:2px; }

.detail-layout { display:grid; grid-template-columns:1fr 320px; gap:22px; }
.detail-main {}
.detail-side {}
.section-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 22px; margin-bottom:18px; }
.section-card h3 { font-size:15px; font-weight:700; color:var(--white); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.desc-text { font-size:13.5px; color:var(--t2); line-height:1.8; }

/* Seasonal chart */
.seasonal-chart { display:flex; gap:6px; align-items:flex-end; height:80px; margin-top:4px; }
.month-bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.month-bar-inner { width:100%; border-radius:4px 4px 0 0; transition:var(--ease); }
.month-bar:hover .month-bar-inner { opacity:0.8; }
.month-lbl { font-size:9px; color:var(--t3); }

/* Guideline list */
.guideline-item {
    display:flex; gap:12px; align-items:flex-start;
    padding:10px 0; border-bottom:1px solid var(--border);
}
.guideline-item:last-child { border-bottom:none; }
.g-icon { font-size:18px; flex-shrink:0; margin-top:1px; }
.g-title { font-size:13px; font-weight:600; color:var(--white); margin-bottom:2px; }
.g-text  { font-size:12px; color:var(--t2); line-height:1.6; }

/* Souvenir item */
.souvenir-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--border);
}
.souvenir-item:last-child { border-bottom:none; }
.souvenir-name { font-size:13px; font-weight:600; color:var(--white); }
.souvenir-vendor { font-size:11px; color:var(--t3); }
.souvenir-price { font-size:13px; font-weight:700; color:var(--accent); }

/* Action panel */
.action-panel {
    background:linear-gradient(135deg,#1b4965,#1e6b8c);
    border:1px solid rgba(245,166,35,0.15);
    border-radius:var(--r-lg); padding:22px; margin-bottom:18px;
}
.action-panel h3 { font-size:16px; font-weight:700; color:var(--white); margin-bottom:5px; }
.action-panel p  { font-size:12.5px; color:rgba(255,255,255,0.6); margin-bottom:16px; line-height:1.6; }
.action-btns { display:flex; flex-direction:column; gap:9px; }

/* Star rating */
.rate-stars { display:flex; gap:6px; margin:10px 0; }
.rate-star { font-size:26px; cursor:pointer; transition:var(--ease); color:var(--t3); }
.rate-star:hover, .rate-star.active { color:var(--accent); transform:scale(1.15); }

@media (max-width:900px) { .detail-layout { grid-template-columns:1fr; } }
</style>
</head>

        <div class="action-btns">

            <a href="route-finder.html?to=${id}" class="btn btn-ghost btn-full" style="background:rgba(255,255,255,0.1)">🗺️ Find Route</a>
            <a href="hotels.html?dest=${id}" class="btn btn-outline-accent btn-full">🏨 View Hotels</a>
        </div>
    </div>

    <div class="section-card">
        <h3>🏨 Top Hotels</h3>
        ${d.hotels.map(h=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
                <span style="font-size:13.5px;font-weight:600;color:var(--white)">${h.name}</span>
                <span class="badge badge-accent">${'★'.repeat(h.stars)}</span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between">
                <span style="font-size:11.5px;color:var(--t3)">⭐ ${h.rating}</span>
                <span style="font-size:13px;font-weight:700;color:var(--accent)">${h.price}</span>
            </div>
        </div>`).join('')}
        <a href="hotels.html?dest=${id}" class="btn btn-ghost btn-full btn-sm" style="margin-top:12px">View All Hotels →</a>
    </div>

    <div class="section-card">
        <h3>🚨 Emergency Contacts</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12.5px;color:var(--t2)">🚔 Police</span><span style="font-weight:700;color:var(--danger)">15</span></div>
            <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12.5px;color:var(--t2)">🚑 Rescue</span><span style="font-weight:700;color:var(--danger)">1122</span></div>
            <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12.5px;color:var(--t2)">📞 Tourist Helpline</span><span style="font-weight:700;color:var(--accent)">1422</span></div>
        </div>
        <a href="emergency.html" class="btn btn-danger btn-full btn-sm" style="margin-top:12px">Full Emergency Guide →</a>
    </div>
</div>
</div>`;

function toggleWish(){
    if(wishlist.includes(id)){wishlist=wishlist.filter(x=>x!==id);document.getElementById('wishBtn').textContent='🤍';showToast('🤍','Removed from wishlist');}
    else{wishlist.push(id);document.getElementById('wishBtn').textContent='❤️';showToast('❤️','Added to wishlist!');}
    saveWish();
}
let userRating=0;
function setRating(v){
    userRating=v;
    document.querySelectorAll('.rate-star').forEach((s,i)=>s.classList.toggle('active',i<v));
    document.getElementById('rateLabel').textContent=`You rated ${v}/5 stars`;
    showToast('⭐',`Thanks for your ${v}-star rating!`);
}

// User
const user=JSON.parse(localStorage.getItem('user')||'{"fullName":"Ahmed Tariq"}');
const ini=(user.fullName||'AT').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
document.getElementById('sidebarInitials').textContent=ini;
document.getElementById('sidebarName').textContent=user.fullName||'Ahmed Tariq';
document.getElementById('topbarInitials').textContent=ini;

const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
document.getElementById('menuToggle').addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show');});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');});

function showToast(icon,msg,dur=2800){const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast';t.innerHTML=`<span class="toast-icon">${icon}</span><span>${msg}</span>`;c.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},dur);}
</script>
</body>
