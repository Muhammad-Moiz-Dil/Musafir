<style>
/* ── Destination selector ── */
.dest-select-wrap {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); padding: 14px 18px;
}
.dest-select-wrap label {
    font-size: 13px; font-weight: 600; color: var(--t2); white-space: nowrap;
}
.dest-select-wrap select {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 9px 12px;
    font-size: 13.5px; font-family: var(--font); color: var(--t1);
    cursor: pointer; outline: none; transition: var(--ease);
}
.dest-select-wrap select:focus { border-color: rgba(245,166,35,0.4); }
.dest-select-wrap select option { background: #0d1b2a; }

/* ── Souvenir grid ── */
.souv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}

/* ── Souvenir card ── */
.souv-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); overflow: hidden;
    transition: var(--ease); display: flex; flex-direction: column;
}
.souv-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}
.souv-img {
    height: 170px; overflow: hidden; position: relative;
    background: var(--surface-2);
}
.souv-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.5s ease;
}
.souv-card:hover .souv-img img { transform: scale(1.06); }
.souv-img-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; color: var(--t3);
}
.souv-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.souv-name { font-size: 15px; font-weight: 700; color: var(--white); }
.souv-vendor {
    font-size: 11.5px; color: var(--t3);
    display: flex; align-items: center; gap: 4px;
}
.souv-desc {
    font-size: 12.5px; color: var(--t2); line-height: 1.6;
    flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
}
.souv-dest-tag {
    font-size: 11px; padding: 3px 9px; margin-top: 10px;
    background: rgba(255,255,255,0.06); border-radius: 999px;
    color: var(--t2); display: inline-block;
}

/* ── Empty / loading states ── */
.souv-empty {
    grid-column: 1/-1; text-align: center; padding: 60px 20px;
    background: var(--surface); border: 1px dashed rgba(255,255,255,0.08);
    border-radius: var(--r-xl);
}
.souv-empty span { font-size: 48px; display: block; margin-bottom: 14px; }
.souv-empty p { font-size: 14px; color: var(--t2); }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Modal overlay ── */
.souv-modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.72); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
}
.souv-modal-overlay.open { opacity: 1; pointer-events: all; }

/* ── Modal box ── */
.souv-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); width: 100%; max-width: 560px;
    overflow: hidden;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.25s ease;
    max-height: 90vh; display: flex; flex-direction: column;
}
.souv-modal-overlay.open .souv-modal { transform: translateY(0) scale(1); }

.souv-modal-img {
    width: 100%; height: 260px; object-fit: cover;
    background: var(--surface-2); flex-shrink: 0;
}
.souv-modal-img-placeholder {
    width: 100%; height: 260px; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 72px; flex-shrink: 0;
}
.souv-modal-body {
    padding: 22px 24px 24px; overflow-y: auto; flex: 1;
}
.souv-modal-header {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px; margin-bottom: 6px;
}
.souv-modal-name { font-size: 20px; font-weight: 700; color: var(--white); line-height: 1.3; }
.souv-modal-close {
    background: rgba(255,255,255,0.07); border: 1px solid var(--border);
    border-radius: 50%; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; color: var(--t2);
    transition: var(--ease);
}
.souv-modal-close:hover { background: rgba(255,255,255,0.13); color: var(--white); }
.souv-modal-meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px;
}
.souv-modal-tag {
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.06); color: var(--t2);
}
.souv-modal-desc {
    font-size: 13.5px; color: var(--t2); line-height: 1.75;
    margin-bottom: 20px;
}
.souv-modal-vendor {
    font-size: 12.5px; color: var(--t3);
    padding-top: 12px; border-top: 1px solid var(--border);
}

/* card cursor */
.souv-card { cursor: pointer; }
</style>
</head>

<script>
// ── Auth guard ──────────────────────────────────────────
const TOKEN = localStorage.getItem('tripify_token');
const USER  = JSON.parse(localStorage.getItem('tripify_user') || '{}');
if (!TOKEN) { window.location.href = '../auth/login.html'; }

// ── Profile picture ─────────────────────────────────────
(function applyProfile(u) {
    const ini = (u.fullName || 'T').split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('sidebarName').textContent = u.fullName || 'Tourist';
    const sa = document.getElementById('sidebarInitials');
    const ta = document.getElementById('topbarInitials');
    if (u.profilePicture && u.profilePicture !== '') {
        const url = 'http://localhost:8080' + u.profilePicture + '?t=' + Date.now();
        sa.innerHTML = '<img src="' + url + '" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentElement.textContent=\'' + ini + '\'">';
        ta.innerHTML = '<img src="' + url + '" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentElement.textContent=\'' + ini + '\'">';
    } else {
        sa.textContent = ini;
        ta.textContent = ini;
    }
})(USER);

// ── Sidebar toggle ──────────────────────────────────────
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
document.getElementById('menuToggle').addEventListener('click', () => {
    sidebar.classList.toggle('open'); overlay.classList.toggle('show');
});
overlay.addEventListener('click', () => {
    sidebar.classList.remove('open'); overlay.classList.remove('show');
});

// ── Toast ───────────────────────────────────────────────
function showToast(icon, msg, dur = 2800) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<span class="toast-icon">' + icon + '</span><span>' + msg + '</span>';
    c.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, dur);
}

// ── Local image map (name → path relative to this page) ─
const SOUVENIR_IMG = {
    'hunza cap':     '../../../../public/assets/images/hunza cap.png',
    'apricot jam':   '../../../../public/assets/images/Apricot Jam.png',
    'shawls':        '../../../../public/assets/images/shawls.png',
    'emerald stone': '../../../../public/assets/images/emeralds.png',
    'emerald':       '../../../../public/assets/images/emeralds.png',
};
function getSouvenirImg(s) {
    if (s.imageUrl) return s.imageUrl;
    return SOUVENIR_IMG[(s.name || '').toLowerCase()] || null;
}

// ── DOM refs ────────────────────────────────────────────
const grid       = document.getElementById('souvGrid');
const countLabel = document.getElementById('countLabel');
const destSelect = document.getElementById('destSelect');

// ── State ───────────────────────────────────────────────
let currentSouvenirs = [];
let searchQuery = '';

// ── Render helpers ──────────────────────────────────────
function showPlaceholder() {
    grid.innerHTML = '<div class="souv-empty"><span>🗺️</span><p>Select a destination above to discover local souvenirs.</p></div>';
    countLabel.textContent = '';
}

function showLoading() {
    grid.innerHTML = '<div class="souv-empty"><span style="animation:spin 1s linear infinite">⏳</span><p>Loading souvenirs…</p></div>';
    countLabel.textContent = '';
}

function showEmpty() {
    grid.innerHTML = '<div class="souv-empty"><span>🎁</span><p>No local souvenirs listed for this area yet. Check back soon.</p></div>';
    countLabel.textContent = '';
}

function showError(msg) {
    grid.innerHTML = '<div class="souv-empty"><span>📶</span><p>' + msg + '</p></div>';
    countLabel.textContent = '';
}

function renderCard(s) {
    const imgSrc  = getSouvenirImg(s);
    const imgHtml = imgSrc
        ? '<img src="' + imgSrc + '" alt="' + s.name + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=&quot;souv-img-placeholder&quot;>🎁</div>\'">'
        : '<div class="souv-img-placeholder">🎁</div>';
    return '<div class="souv-card" onclick="openModal(' + s.id + ')">' +
        '<div class="souv-img">' + imgHtml + '</div>' +
        '<div class="souv-body">' +
            '<div class="souv-name">' + s.name + '</div>' +
            (s.vendorName ? '<div class="souv-vendor">🏪 ' + s.vendorName + '</div>' : '') +
            (s.description ? '<div class="souv-desc">' + s.description + '</div>' : '') +
            '<span class="souv-dest-tag">📍 ' + (s.destinationName || 'Pakistan') + '</span>' +
        '</div></div>';
}

function renderGrid() {
    let items = currentSouvenirs;
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        items = items.filter(s =>
            (s.name || '').toLowerCase().includes(q) ||
            (s.description || '').toLowerCase().includes(q) ||
            (s.vendorName || '').toLowerCase().includes(q)
        );
    }
    if (!items.length) { showEmpty(); return; }
    countLabel.textContent = items.length + ' souvenir' + (items.length !== 1 ? 's' : '') + ' found';
    grid.innerHTML = items.map(renderCard).join('');
}

// ── Modal ───────────────────────────────────────────────
const modalOverlay = document.getElementById('souvModal');

function openModal(id) {
    const s = currentSouvenirs.find(x => x.id === id);
    if (!s) return;
    const imgEl  = document.getElementById('souvModalImg');
    const imgSrc = getSouvenirImg(s);
    imgEl.innerHTML = imgSrc
        ? '<img class="souv-modal-img" src="' + imgSrc + '" alt="' + s.name + '" onerror="this.outerHTML=\'<div class=&quot;souv-modal-img-placeholder&quot;>🎁</div>\'">'
        : '<div class="souv-modal-img-placeholder">🎁</div>';
    document.getElementById('souvModalName').textContent = s.name || '';
    document.getElementById('souvModalDesc').textContent = s.description || 'No description available.';
    document.getElementById('souvModalVendor').textContent = s.vendorName ? '🏪 ' + s.vendorName : '';
    const meta = [];
    if (s.destinationName) meta.push('📍 ' + s.destinationName);
    document.getElementById('souvModalMeta').innerHTML = meta.map(t => '<span class="souv-modal-tag">' + t + '</span>').join('');
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
}

document.getElementById('souvModalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Load destinations into dropdown ────────────────────
async function loadDestinations() {
    try {
        const res = await fetch(ENDPOINTS.DESTINATIONS.SEARCH, {
            headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        if (res.status === 401) { window.location.href = '../auth/login.html'; return; }
        if (!res.ok) return;
        const dests = await res.json();
        const list = Array.isArray(dests) ? dests : (dests.destinations || dests.content || []);
        list.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.destinationId || d.id;
            opt.textContent = d.name;
            destSelect.appendChild(opt);
        });
    } catch (e) { /* silently ignore — user can still type */ }
}

// ── Load souvenirs for selected destination ─────────────
async function loadSouvenirs(destId) {
    showLoading();
    try {
        const res = await fetch(ENDPOINTS.SOUVENIRS.BY_DESTINATION(destId), {
            headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        if (res.status === 401) { window.location.href = '../auth/login.html'; return; }
        if (res.status === 404) { currentSouvenirs = []; showEmpty(); return; }
        if (!res.ok) { showError('Something went wrong. Please try again later.'); return; }
        const data = await res.json();
        currentSouvenirs = Array.isArray(data) ? data : [];
        if (!currentSouvenirs.length) { showEmpty(); return; }
        renderGrid();
    } catch (e) {
        showError('Network error. Please check your connection and try again.');
    }
}

// ── Destination select handler ──────────────────────────
destSelect.addEventListener('change', () => {
    const val = destSelect.value;
    searchQuery = '';
    document.getElementById('topSearch').value = '';
    if (!val) { currentSouvenirs = []; showPlaceholder(); return; }
    loadSouvenirs(val);
});

// ── Search ──────────────────────────────────────────────
document.getElementById('topSearch').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    if (currentSouvenirs.length) renderGrid();
});

// ── Boot ────────────────────────────────────────────────
showPlaceholder();
loadDestinations();
</script>
</body>
</html>
